<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Chemistry Crossword Challenge</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --primary-navy:#1a2a3a;
  --accent-gold:#c5a059;
  --bg-body:#f8f9fa;
  --bg-card:#ffffff;
  --text-main:#2d3436;
  --text-muted:#636e72;
  --border-light:#e1e4e8;
  --highlight-blue:#edf2f7;
  --active-gold:#fcf8e3;
}

* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

body {
  margin:0;
  font-family:Inter,sans-serif;
  background:var(--bg-body);
  color:var(--text-main);
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:16px;
}

h1 {
  font-family:'Libre Baskerville',serif;
  margin:0;
  color:var(--primary-navy);
}

.subtitle {
  font-size:.75rem;
  color:var(--text-muted);
  margin-bottom:16px;
  letter-spacing:2px;
  text-transform:uppercase;
}

button { cursor:pointer; }

.puzzle-selector {
  background:var(--bg-card);
  border:1px solid var(--border-light);
  border-radius:12px;
  padding:24px;
  max-width:420px;
  width:100%;
}

.puzzle-grid {
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:10px;
}

.puzzle-btn {
  aspect-ratio:1;
  border-radius:8px;
  border:1px solid var(--border-light);
  font-weight:700;
  background:white;
}

.crossword-view { display:none; width:100%; max-width:900px; }
.crossword-view.active { display:block; }

.top-bar {
  display:flex;
  gap:8px;
  justify-content:space-between;
  flex-wrap:wrap;
  margin-bottom:12px;
}

.action-btn {
  padding:8px 12px;
  border-radius:6px;
  border:1px solid var(--border-light);
  background:white;
  font-weight:600;
}

.check-btn {
  background:var(--primary-navy);
  color:white;
  border:none;
}

.direction-toggle {
  display:flex;
  justify-content:center;
  gap:8px;
  margin-bottom:12px;
}

.dir-btn {
  padding:6px 14px;
  border-radius:20px;
  border:1px solid var(--border-light);
  background:white;
  font-weight:600;
}

.dir-btn.active {
  background:var(--primary-navy);
  color:white;
}

.container {
  background:white;
  border-radius:12px;
  padding:16px;
  border:1px solid var(--border-light);
}

.grid-wrapper {
  width:100%;
  display:flex;
  justify-content:center;
}

.grid {
  display:grid;
  gap:1px;
  background:var(--primary-navy);
  width:100%;
  max-width:90vw;
}

.cell {
  aspect-ratio:1;
  background:white;
  position:relative;
}

.cell.null { background:var(--primary-navy); }

.cell-number {
  position:absolute;
  top:2px;
  left:3px;
  font-size:9px;
  font-weight:700;
  color:var(--primary-navy);
}

.cell-input {
  width:100%;
  height:100%;
  border:none;
  text-align:center;
  font-size:1rem;
  font-weight:700;
  text-transform:uppercase;
  outline:none;
}

.cell.highlighted { background:var(--highlight-blue); }
.cell.active-cell { background:var(--active-gold); }

.current-clue {
  margin-top:12px;
  padding:12px;
  background:var(--bg-body);
  border-left:4px solid var(--accent-gold);
  font-size:1rem;
}

.progress-bar {
  height:6px;
  background:var(--border-light);
  border-radius:3px;
  overflow:hidden;
  margin-top:12px;
}

.progress-fill {
  height:100%;
  background:var(--accent-gold);
  width:0%;
}

/* Bottom Sheet Clues */
.clue-sheet {
  position:fixed;
  inset:auto 0 0 0;
  height:70vh;
  background:white;
  border-radius:16px 16px 0 0;
  transform:translateY(100%);
  transition:.3s ease;
  z-index:1000;
  padding:16px;
}

.clue-sheet.active { transform:translateY(0); }

.sheet-header {
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.sheet-content {
  overflow-y:auto;
  height:100%;
}

.clue-item {
  padding:8px;
  border-radius:6px;
}

.clue-item.active {
  background:var(--highlight-blue);
}

@media(min-width:900px){
  .container {
    display:grid;
    grid-template-columns:1fr 320px;
    gap:16px;
  }
  .clues-desktop {
    display:block;
  }
}

.clues-desktop { display:none; }
</style>
</head>

<body>

<h1>Chemistry Crosswords</h1>
<div class="subtitle">Periodic Elements & Principles</div>

<div class="puzzle-selector" id="puzzleSelector">
  <div class="puzzle-grid" id="puzzleGrid"></div>
</div>

<div class="crossword-view" id="crosswordView">

  <div class="top-bar">
    <button class="action-btn" onclick="showSelector()">← Back</button>
    <div>
      <button class="action-btn check-btn" onclick="checkAnswers()">Check</button>
      <button class="action-btn" onclick="clearPuzzle()">Clear</button>
      <button class="action-btn" onclick="openClues()">Clues</button>
    </div>
  </div>

  <div class="direction-toggle">
    <button class="dir-btn active" id="dirAcross">Across</button>
    <button class="dir-btn" id="dirDown">Down</button>
  </div>

  <div class="container">
    <div>
      <div class="grid-wrapper">
        <div class="grid" id="crosswordGrid"></div>
      </div>

      <div class="current-clue">
        <strong id="clueNum">#</strong>
        <span id="clueText">Tap a cell to begin</span>
      </div>

      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>

    <div class="clues-desktop">
      <h3>Across</h3>
      <ul id="acrossCluesList"></ul>
      <h3>Down</h3>
      <ul id="downCluesList"></ul>
    </div>
  </div>
</div>

<div class="clue-sheet" id="clueSheet">
  <div class="sheet-header">
    <strong>Clues</strong>
    <button onclick="closeClues()">✕</button>
  </div>
  <div class="sheet-content">
    <h3>Across</h3>
    <ul id="sheetAcross"></ul>
    <h3>Down</h3>
    <ul id="sheetDown"></ul>
  </div>
</div>

<script>
let puzzlesData=[],currentPuzzle=null,currentDirection='across',cellInputs=[],lastCell=null;

document.getElementById('dirAcross').onclick=()=>setDirection('across');
document.getElementById('dirDown').onclick=()=>setDirection('down');

function setDirection(d){
 currentDirection=d;
 document.querySelectorAll('.dir-btn').forEach(b=>b.classList.remove('active'));
 document.getElementById(d==='across'?'dirAcross':'dirDown').classList.add('active');
}

async function loadPuzzles(){
 const res=await fetch('chem_crosswords_fixed.json');
 puzzlesData=await res.json();
 const grid=document.getElementById('puzzleGrid');
 for(let i=1;i<=20;i++){
  const b=document.createElement('button');
  b.className='puzzle-btn';
  b.textContent=i;
  b.onclick=()=>showPuzzle(i);
  grid.appendChild(b);
 }
}

function showSelector(){
 document.getElementById('puzzleSelector').style.display='block';
 document.getElementById('crosswordView').classList.remove('active');
}

function showPuzzle(n){
 currentPuzzle=puzzlesData.find(p=>p.puzzle_id===n);
 document.getElementById('puzzleSelector').style.display='none';
 document.getElementById('crosswordView').classList.add('active');
 renderGrid();
 renderClues();
}

function renderGrid(){
 const g=currentPuzzle;
 const el=document.getElementById('crosswordGrid');
 el.style.gridTemplateColumns=`repeat(${g.cols},1fr)`;
 el.innerHTML='';
 cellInputs=[];
 g.grid.forEach((row,r)=>row.forEach((v,c)=>{
  if(v===null){ el.innerHTML+='<div class="cell null"></div>'; return;}
  const d=document.createElement('div');
  d.className='cell';
  d.dataset.row=r; d.dataset.col=c;
  if(g.number_grid[r][c]){
   d.innerHTML=`<span class="cell-number">${g.number_grid[r][c]}</span>`;
  }
  const i=document.createElement('input');
  i.className='cell-input';
  i.maxLength=1;
  i.dataset.answer=v;
  i.dataset.row=r; i.dataset.col=c;
  i.onfocus=()=>focusCell(i);
  i.oninput=()=>{i.value=i.value.toUpperCase(); moveNext(i); updateProgress();}
  d.appendChild(i);
  el.appendChild(d);
  cellInputs.push(i);
 }));
}

function focusCell(i){
 if(lastCell===i) setDirection(currentDirection==='across'?'down':'across');
 lastCell=i;
 highlightWord(i);
}

function highlightWord(i){
 document.querySelectorAll('.cell').forEach(c=>c.classList.remove('highlighted','active-cell'));
 i.parentElement.classList.add('active-cell');
 const r=+i.dataset.row,c=+i.dataset.col;
 const w=currentPuzzle.words.find(w=>{
  if(w.direction!==currentDirection)return false;
  for(let k=0;k<w.word.length;k++){
   if(w.start_row+(currentDirection==='down'?k:0)===r &&
      w.start_col+(currentDirection==='across'?k:0)===c) return true;
  }
 });
 if(!w)return;
 document.getElementById('clueNum').textContent=w.number;
 document.getElementById('clueText').textContent=w.clue;
 for(let k=0;k<w.word.length;k++){
  const cell=document.querySelector(`.cell[data-row="${w.start_row+(currentDirection==='down'?k:0)}"][data-col="${w.start_col+(currentDirection==='across'?k:0)}"]`);
  if(cell)cell.classList.add('highlighted');
 }
}

function moveNext(i){
 const r=+i.dataset.row,c=+i.dataset.col;
 const n=document.querySelector(`input[data-row="${currentDirection==='down'?r+1:r}"][data-col="${currentDirection==='across'?c+1:c}"]`);
 if(n)n.focus();
}

function renderClues(){
 ['across','down'].forEach(d=>{
  document.getElementById(d+'CluesList').innerHTML='';
  document.getElementById('sheet'+d.charAt(0).toUpperCase()+d.slice(1)).innerHTML='';
 });
 currentPuzzle.words.forEach(w=>{
  const li=document.createElement('li');
  li.className='clue-item';
  li.textContent=`${w.number}. ${w.clue}`;
  li.onclick=()=>{
   setDirection(w.direction);
   document.querySelector(`input[data-row="${w.start_row}"][data-col="${w.start_col}"]`).focus();
   closeClues();
  };
  document.getElementById(w.direction+'CluesList').appendChild(li);
  document.getElementById('sheet'+w.direction.charAt(0).toUpperCase()+w.direction.slice(1)).appendChild(li.cloneNode(true));
 });
}

function updateProgress(){
 document.getElementById('progressFill').style.width=
  (cellInputs.filter(i=>i.value).length/cellInputs.length*100)+'%';
}

function checkAnswers(){
 cellInputs.forEach(i=>i.style.color=i.value===i.dataset.answer?'green':'red');
}

function clearPuzzle(){
 cellInputs.forEach(i=>{i.value='';i.style.color='';});
 updateProgress();
}

function openClues(){document.getElementById('clueSheet').classList.add('active');}
function closeClues(){document.getElementById('clueSheet').classList.remove('active');}

loadPuzzles();
</script>

</body>
</html>
