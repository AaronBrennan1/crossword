<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chemistry Crosswords</title>
    <style>
        :root {
            --cell-size: 32px;
            --border-color: #333;
            --empty-color: #222;
            --text-color: #000;
            --clue-bg: #f9f9f9;
            --primary-color: #3498db;
            --primary-dark: #2980b9;
        }
        
        * {
            box-sizing: border-box;
        }
        
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 20px; 
            background-color: #eef2f3;
            margin: 0;
            min-height: 100vh;
        }
        
        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
        }
        
        /* Puzzle Selector Styles */
        .puzzle-selector {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 800px;
            width: 100%;
        }
        
        .puzzle-selector h2 {
            margin: 0 0 10px 0;
            color: #2c3e50;
        }
        
        .puzzle-selector p {
            color: #666;
            margin: 0 0 20px 0;
        }
        
        .puzzle-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            width: 100%;
            max-width: 500px;
        }
        
        .puzzle-btn {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: bold;
            color: white;
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .puzzle-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.2);
        }
        
        .puzzle-btn:active {
            transform: translateY(-1px);
        }
        
        /* Crossword View Styles */
        .crossword-view {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }
        
        .crossword-view.active {
            display: flex;
        }
        
        .back-btn {
            align-self: flex-start;
            margin-bottom: 15px;
            padding: 10px 20px;
            font-size: 1rem;
            color: white;
            background: #6c757d;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .back-btn:hover {
            background: #5a6268;
        }
        
        .puzzle-title {
            margin: 0 0 20px 0;
            color: #2c3e50;
            border-bottom: 3px solid var(--primary-color);
            padding-bottom: 10px;
        }
        
        .container { 
            display: flex; 
            gap: 40px; 
            background: white; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
            max-width: 95vw;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        /* Grid Styles */
        .grid-wrapper {
            overflow-x: auto;
        }
        
        .grid { 
            display: grid; 
            border: 2px solid var(--border-color); 
            background-color: var(--border-color);
            gap: 1px;
        }
        
        .cell {
            width: var(--cell-size);
            height: var(--cell-size);
            background-color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1rem;
            position: relative;
        }
        
        .null { 
            background-color: var(--empty-color); 
        }
        
        .cell-number {
            position: absolute;
            top: 1px;
            left: 2px;
            font-size: 0.55rem;
            font-weight: normal;
            color: #555;
        }

        /* Clue Styles */
        .clues { 
            max-width: 400px; 
            min-width: 280px;
            max-height: 600px; 
            overflow-y: auto; 
            padding-right: 15px; 
        }
        
        .clues h3 { 
            color: var(--primary-dark); 
            margin-bottom: 10px;
            margin-top: 0;
            position: sticky;
            top: 0;
            background: white;
            padding: 5px 0;
        }
        
        .clues h3:not(:first-child) {
            margin-top: 20px;
        }
        
        .clues ul { 
            list-style: none; 
            padding: 0; 
            margin: 0;
        }
        
        .clues li { 
            margin-bottom: 10px; 
            font-size: 0.9rem; 
            line-height: 1.4; 
            padding-bottom: 8px; 
            border-bottom: 1px solid #eee; 
        }
        
        .num { 
            font-weight: bold; 
            margin-right: 8px; 
            color: #333;
            display: inline-block;
            min-width: 20px;
        }
        
        /* Responsive */
        @media (max-width: 900px) {
            .container {
                flex-direction: column;
                align-items: center;
            }
            
            .clues {
                max-height: 400px;
            }
            
            :root {
                --cell-size: 28px;
            }
        }
        
        @media (max-width: 600px) {
            .puzzle-grid {
                grid-template-columns: repeat(4, 1fr);
            }
            
            :root {
                --cell-size: 24px;
            }
            
            .cell-number {
                font-size: 0.5rem;
            }
            
            .cell {
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>

    <h1>🧪 Chemistry Crosswords</h1>
    
    <!-- Puzzle Selector -->
    <div class="puzzle-selector" id="puzzleSelector">
        <h2>Select a Puzzle</h2>
        <p>Choose from 20 chemistry-themed crossword puzzles</p>
        <div class="puzzle-grid" id="puzzleGrid">
            <!-- Buttons will be generated by JS -->
        </div>
    </div>
    
    <!-- Crossword View -->
    <div class="crossword-view" id="crosswordView">
        <button class="back-btn" onclick="showSelector()">← Back to Puzzles</button>
        <h2 class="puzzle-title" id="puzzleTitle">Chemistry Crossword: Puzzle #1</h2>
        <div class="container">
            <div class="grid-wrapper">
                <div class="grid" id="crosswordGrid">
                    <!-- Grid will be generated by JS -->
                </div>
            </div>
            <div class="clues" id="cluesContainer">
                <!-- Clues will be generated by JS -->
            </div>
        </div>
    </div>

    <script>
        let puzzlesData = [];
        
        // Load puzzles data
        async function loadPuzzles() {
            try {
                const response = await fetch('chem_crosswords_fixed.json');
                puzzlesData = await response.json();
                generatePuzzleButtons();
            } catch (error) {
                console.error('Error loading puzzles:', error);
                document.getElementById('puzzleGrid').innerHTML = 
                    '<p style="color: red; grid-column: 1/-1;">Error loading puzzles. Make sure chem_crosswords_fixed.json is in the same folder.</p>';
            }
        }
        
        // Generate puzzle selection buttons
        function generatePuzzleButtons() {
            const grid = document.getElementById('puzzleGrid');
            grid.innerHTML = '';
            
            for (let i = 1; i <= 20; i++) {
                const btn = document.createElement('button');
                btn.className = 'puzzle-btn';
                btn.textContent = i;
                btn.onclick = () => showPuzzle(i);
                grid.appendChild(btn);
            }
        }
        
        // Show puzzle selector
        function showSelector() {
            document.getElementById('puzzleSelector').style.display = 'flex';
            document.getElementById('crosswordView').classList.remove('active');
        }
        
        // Show specific puzzle
        function showPuzzle(puzzleNum) {
            const puzzle = puzzlesData.find(p => p.puzzle_id === puzzleNum);
            if (!puzzle) {
                alert('Puzzle not found!');
                return;
            }
            
            document.getElementById('puzzleSelector').style.display = 'none';
            document.getElementById('crosswordView').classList.add('active');
            document.getElementById('puzzleTitle').textContent = `Chemistry Crossword: Puzzle #${puzzleNum}`;
            
            renderGrid(puzzle);
            renderClues(puzzle);
        }
        
        // Render the crossword grid
        function renderGrid(puzzle) {
            const gridEl = document.getElementById('crosswordGrid');
            const { grid, number_grid, rows, cols } = puzzle;
            
            // Set grid dimensions
            gridEl.style.gridTemplateColumns = `repeat(${cols}, var(--cell-size))`;
            gridEl.style.gridTemplateRows = `repeat(${rows}, var(--cell-size))`;
            
            let html = '';
            
            for (let row = 0; row < rows; row++) {
                for (let col = 0; col < cols; col++) {
                    const cellValue = grid[row][col];
                    const cellNumber = number_grid[row][col];
                    
                    if (cellValue === null) {
                        html += '<div class="cell null"></div>';
                    } else {
                        const numberHtml = cellNumber ? `<span class="cell-number">${cellNumber}</span>` : '';
                        html += `<div class="cell">${numberHtml}${cellValue}</div>`;
                    }
                }
            }
            
            gridEl.innerHTML = html;
        }
        
        // Render the clues
        function renderClues(puzzle) {
            const cluesEl = document.getElementById('cluesContainer');
            const { words } = puzzle;
            
            // Separate across and down clues
            const acrossClues = words
                .filter(w => w.direction === 'across')
                .sort((a, b) => a.number - b.number);
            
            const downClues = words
                .filter(w => w.direction === 'down')
                .sort((a, b) => a.number - b.number);
            
            let html = '<h3>Across</h3><ul>';
            
            for (const clue of acrossClues) {
                html += `<li><span class="num">${clue.number}</span>${clue.clue}</li>`;
            }
            
            html += '</ul><h3>Down</h3><ul>';
            
            for (const clue of downClues) {
                html += `<li><span class="num">${clue.number}</span>${clue.clue}</li>`;
            }
            
            html += '</ul>';
            
            cluesEl.innerHTML = html;
        }
        
        // Initialize
        loadPuzzles();
    </script>

</body>
</html>
