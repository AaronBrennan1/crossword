<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Chemistry Crossword Challenge</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
    --primary-navy:#1a2a3a;
    --accent-gold:#c5a059;
    --highlight-blue:#edf2f7;
    --active-gold:#fcf8e3;
    --cell-size:clamp(30px,8vw,45px);
}
* { box-sizing:border-box }
body {
    margin:0;
    font-family:Inter,sans-serif;
    background:#f8f9fa;
    display:flex;
    flex-direction:column;
    align-items:center;
}
header {
    width:100%;
    padding:20px;
    background:#fff;
    text-align:center;
    border-bottom:1px solid #e1e4e8;
}
.grid {
    display:grid;
    gap:1px;
    background:var(--primary-navy);
    border:2px solid var(--primary-navy);
    margin:0 auto;
}
.cell {
    width:var(--cell-size);
    height:var(--cell-size);
    background:#fff;
    position:relative;
}
.cell.null { background:var(--primary-navy) }
.cell.highlighted { background:var(--highlight-blue) }
.cell.active-cell {
    background:var(--active-gold)!important;
    outline:2px solid var(--accent-gold);
}
.cell-number {
    position:absolute;
    top:1px;
    left:2px;
    font-size:9px;
    font-weight:700;
}
.cell-input {
    width:100%;
    height:100%;
    border:none;
    text-align:center;
    font-size:18px;
    font-weight:700;
    background:transparent;
    outline:none;
    text-transform:uppercase;
}
</style>
</head>

<body>

<header id="mainHeader">
    <h1>Chemistry Crossword</h1>
</header>

<div id="puzzleSelector"></div>

<div id="crosswordView" style="display:none">
    <div id="clueBar">
        <b id="clueLabel">Select a cell</b>
        <div id="clueText"></div>
        <button onclick="toggleDirection()">⇄</button>
    </div>
    <div id="crosswordGrid" class="grid"></div>
</div>

<script>
let puzzlesData = [];
let currentPuzzle = null;
let currentDirection = 'across';
let cellInputs = [];

/* ---------- INIT ---------- */
async function init() {
    const res = await fetch('chem_crosswords_fixed.json');
    puzzlesData = await res.json();

    // Normalize data (prevents bad JSON from breaking runtime)
    puzzlesData.forEach(p => {
        p.words.forEach(w => {
            if (!w.word && w.answer) w.word = w.answer;
        });
    });

    const sel = document.getElementById('puzzleSelector');
    puzzlesData.forEach(p => {
        const b = document.createElement('button');
        b.textContent = p.puzzle_id;
        b.onclick = () => startPuzzle(p.puzzle_id);
        sel.appendChild(b);
    });
}

function startPuzzle(id) {
    currentPuzzle = puzzlesData.find(p => p.puzzle_id === id);
    document.getElementById('puzzleSelector').style.display = 'none';
    document.getElementById('crosswordView').style.display = 'block';
    renderGrid();
}

/* ---------- GRID ---------- */
function renderGrid() {
    const g = document.getElementById('crosswordGrid');
    g.style.gridTemplateColumns = `repeat(${currentPuzzle.cols}, var(--cell-size))`;
    g.innerHTML = '';

    for (let r=0;r<currentPuzzle.rows;r++) {
        for (let c=0;c<currentPuzzle.cols;c++) {
            const val = currentPuzzle.grid[r][c];
            const num = currentPuzzle.number_grid[r][c];
            if (val === null) {
                g.innerHTML += `<div class="cell null"></div>`;
            } else {
                g.innerHTML += `
                <div class="cell" data-row="${r}" data-col="${c}" onclick="handleCellClick(this)">
                    ${num ? `<span class="cell-number">${num}</span>` : ''}
                    <input class="cell-input"
                        maxlength="1"
                        data-row="${r}"
                        data-col="${c}"
                        data-answer="${val}"
                        onfocus="handleFocus(this)"
                        oninput="handleInput(this)"
                        onkeydown="handleKeydown(event,this)">
                </div>`;
            }
        }
    }
    cellInputs = [...document.querySelectorAll('.cell-input')];
}

/* ---------- CORE FIX ---------- */
function findWordAt(r, c, dir) {
    if (!currentPuzzle || !Array.isArray(currentPuzzle.words)) return null;

    return currentPuzzle.words.find(w => {
        if (!w || !w.word || !w.direction) return false;
        if (w.direction !== dir) return false;

        const dr = dir === 'down' ? 1 : 0;
        const dc = dir === 'across' ? 1 : 0;

        for (let i=0;i<w.word.length;i++) {
            if (w.start_row + i*dr === r &&
                w.start_col + i*dc === c) return true;
        }
        return false;
    });
}

/* ---------- UI ---------- */
function handleCellClick(div) {
    const i = div.querySelector('input');
    if (document.activeElement === i) toggleDirection();
    else i.focus();
}

function handleFocus(input) {
    const r = +input.dataset.row;
    const c = +input.dataset.col;

    const hasAcross = findWordAt(r,c,'across');
    const hasDown = findWordAt(r,c,'down');

    if (hasAcross && !hasDown) currentDirection = 'across';
    else if (hasDown && !hasAcross) currentDirection = 'down';

    updateHighlights(r,c);
}

function updateHighlights(r,c) {
    const w = findWordAt(r,c,currentDirection);
    if (!w) return;

    document.querySelectorAll('.cell').forEach(el =>
        el.classList.remove('highlighted','active-cell')
    );

    const active = document.querySelector(`.cell[data-row="${r}"][data-col="${c}"]`);
    if (active) active.classList.add('active-cell');

    document.getElementById('clueLabel').textContent =
        `${w.number} ${w.direction.toUpperCase()}`;
    document.getElementById('clueText').textContent = w.clue;

    const dr = w.direction === 'down' ? 1 : 0;
    const dc = w.direction === 'across' ? 1 : 0;

    for (let i=0;i<w.word.length;i++) {
        const cell = document.querySelector(
            `.cell[data-row="${w.start_row+i*dr}"][data-col="${w.start_col+i*dc}"]`
        );
        if (cell) cell.classList.add('highlighted');
    }
}

function toggleDirection() {
    const a = document.activeElement;
    if (!a?.dataset.row) return;
    const r = +a.dataset.row;
    const c = +a.dataset.col;
    const next = currentDirection === 'across' ? 'down' : 'across';
    if (findWordAt(r,c,next)) {
        currentDirection = next;
        updateHighlights(r,c);
    }
}

/* ---------- INPUT ---------- */
function handleInput(i) {
    i.value = i.value.toUpperCase();
    if (i.value) moveFocus(i,1);
}

function handleKeydown(e,i) {
    if (e.key === 'Backspace' && !i.value) {
        e.preventDefault();
        moveFocus(i,-1);
    }
}

function moveFocus(i,step) {
    const r = +i.dataset.row;
    const c = +i.dataset.col;
    const nr = currentDirection === 'down' ? r+step : r;
    const nc = currentDirection === 'across' ? c+step : c;
    const n = document.querySelector(`.cell-input[data-row="${nr}"][data-col="${nc}"]`);
    if (n) n.focus();
}

init();
</script>
</body>
</html>
